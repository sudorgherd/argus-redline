[platformio]
src_dir = .
default_envs = tx, rx

[firmware]
platform = espressif32
board = heltec_wifi_lora_32_V4
framework = arduino

lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.6.1
    jgromes/RadioLib

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

[env:native]
platform = native
framework =
lib_deps =
test_framework = unity
test_ignore = device_config_compile

[device_config_compile]
platform = native
framework =
lib_deps =
build_src_filter =
    -<*>
    +<test/device_config_compile/**>

[env:config_hub_valid]
extends = device_config_compile
build_flags =
    -DARGUS_LOCAL_DEVICE_ID=0x01
    -DARGUS_PEER_DEVICE_ID=0x10
    -DARGUS_EXPECT_HUB_CONFIGURATION

[env:config_node_valid]
extends = device_config_compile
build_flags =
    -DARGUS_LOCAL_DEVICE_ID=0x10
    -DARGUS_PEER_DEVICE_ID=0x01
    -DARGUS_EXPECT_NODE_CONFIGURATION

[env:config_missing_local]
extends = device_config_compile
build_flags =
    -DARGUS_PEER_DEVICE_ID=0x10

[env:config_missing_peer]
extends = device_config_compile
build_flags =
    -DARGUS_LOCAL_DEVICE_ID=0x01

[env:config_equal_ids]
extends = device_config_compile
build_flags =
    -DARGUS_LOCAL_DEVICE_ID=0x01
    -DARGUS_PEER_DEVICE_ID=0x01

[env:tx]
extends = firmware
board_build.variants_dir = variants
board_build.variant = heltec_V4
build_flags =
    -DARGUS_LOCAL_DEVICE_ID=0x01
    -DARGUS_PEER_DEVICE_ID=0x10
build_src_filter =
    +<src-tx/**>
    -<src-rx/**>
upload_port = COM4
monitor_port = COM4

[env:rx]
extends = firmware
board_build.variants_dir = variants
board_build.variant = heltec_V4
build_flags =
    -DARGUS_LOCAL_DEVICE_ID=0x10
    -DARGUS_PEER_DEVICE_ID=0x01
build_src_filter =
    +<src-rx/**>
    -<src-tx/**>
upload_port = COM5
monitor_port = COM5

[env:tx_capability_characterization]
extends = env:tx
build_flags =
    -DARGUS_LOCAL_DEVICE_ID=0x01
    -DARGUS_PEER_DEVICE_ID=0x10
    -DARGUS_CAPABILITY_CHARACTERIZATION=1

[env:rx_capability_characterization]
extends = env:rx
build_flags =
    -DARGUS_LOCAL_DEVICE_ID=0x10
    -DARGUS_PEER_DEVICE_ID=0x01
    -DARGUS_CAPABILITY_CHARACTERIZATION=1
